services:
  - type: web
    name: git-analyser-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: GITHUB_API_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RAG_MODE
        value: cloud
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GEMINI_LLM_MODEL
        value: gemini-flash-latest
